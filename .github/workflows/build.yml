name: Build NetWatch Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Download dependencies and create go.sum
      run: go mod tidy
    
    - name: Build
      run: go build -o netwatch-agent.exe .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: netwatch-agent-windows
        path: netwatch-agent.exe
