name: Build NetWatch Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build
      run: go build -o netwatch-agent.exe .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: netwatch-agent-windows
        path: netwatch-agent.exe
