name: Build NetWatch Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Let Go find the latest working version
      run: |
        go mod init netwatch-agent
        go get github.com/go-routeros/routeros@latest
        go get github.com/melbahja/goph@v1.4.0
        go get github.com/pkg/errors@v0.9.1
        go get golang.org/x/crypto@v0.21.0
    
    - name: Build
      run: go build -o netwatch-agent.exe .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: netwatch-agent-windows
        path: netwatch-agent.exe
